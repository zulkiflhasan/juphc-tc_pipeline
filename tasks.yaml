apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: npm
spec:
  description: Install application dependencies in a shared workspace.
  workspaces:
    - name: source
  steps:
    - name: install
      image: node:20-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        test -f package.json
        if [ -f package-lock.json ]; then npm ci; else npm install; fi
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: jasmine
spec:
  description: Run Jasmine unit tests after dependencies have been installed.
  workspaces:
    - name: source
  steps:
    - name: test
      image: node:20-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        npx --no-install jasmine
