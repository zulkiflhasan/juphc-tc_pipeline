apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: tax-calculator-run-
spec:
  pipelineRef:
    name: tax-calculator-pipeline
  params:
    - name: repo-url
      value: https://github.com/zulkiflhasan/juphc-tc_pipeline.git
    - name: revision
      value: main
    - name: image
      value: us.icr.io/REPLACE_WITH_YOUR_NAMESPACE/tax-calculator:latest
  workspaces:
    - name: shared-data
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
    - name: dockerconfig
      secret:
        secretName: icr-docker-config
